<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Best Mart</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="projek.css">
</head>
<body>

<div class="container">
    <div class="image-section">
        <img src="3d-toko.png" alt="Gambar 3D Toko" class="store-image" 
             onerror="this.src='https: //images.unsplash.com/photo-1604719312566-8912e9227c6a?q=80&w=1000&auto=format&fit=crop'">
    </div>

    <div class="form-section">
        <div class="wrapper">
            <form action="">
                <img src="Animasi.jpeg" alt="Logo Toko" class="logo" 
                     onerror="this.style.display='none'">
                
                <h1>Login</h1>
                <p class="welcome-text">Senang melihat Anda kembali!</p>

                <div class="input-box">
                    <input type="text" placeholder="Username" required>
                    <i class='bx bxs-user'></i> 
                </div>

                <div class="input-box">
                    <input type="password" placeholder="Password" required>
                    <i class='bx bxs-lock-alt' ></i> 
                </div>

                <div class="remember-forgot">
                    <label><input type="checkbox"> Remember me</label>
                    <a href="#">Forgot password?</a>
                </div>

                <button type="submit" class="btn">Login</button>

                <div class="social-login">
                    <p>Atau masuk dengan</p>
                    <div class="social-icons">
                        <a href="#"><i class='bx bxl-google'></i></a>
                        <a href="#"><i class='bx bxl-facebook-circle'></i></a>
                        <a href="#"><i class='bx bxl-apple'></i></a>
                    </div>
                </div>

                <div class="register-link">
                    <p>Don't have an account? <a href="#">Register</a></p>
                </div>
            </form>
        </div>
    </div>
</div>

</body>
</html>
